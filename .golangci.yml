# golangci-lint configuration — the workspace lint gate.
#
# Posture: strict by default. A finding is fixed, not
# silenced; a `//nolint` needs a reason and is itself linted by `nolintlint`.
version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod

linters:
  default: standard
  enable:
    # Correctness
    - bodyclose          # Telegram Bot API responses must be closed
    - containedctx       # no context.Context stored in a struct field
    - contextcheck
    - durationcheck
    - errorlint          # %w wrapping, errors.Is/As over == and type asserts
    - exhaustive         # every FSM state / enum switch is total
    - fatcontext         # no context nested in a loop or a function literal
    - forbidigo          # no fresh root context, no unstoppable timer/ticker, outside main/tests
    - makezero
    - nilerr
    - noctx              # no outbound HTTP without a context
    - rowserrcheck       # pgx/database-sql: rows.Err() checked
    - sqlclosecheck      # pgx/database-sql: rows/stmts closed
    - unconvert
    - wastedassign
    # Security
    - gosec
    # Style / clarity
    - asciicheck         # identifiers stay ASCII; the Russian design corpus is untouched
    - goconst
    - gocritic
    - misspell
    - nolintlint
    - predeclared
    - revive             # incl. exported-symbol doc comments
    - unparam
    - whitespace

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: '^context\.Background$'
          msg: "a fresh root context needs a stated reason and a named owner — carry the caller's ctx, or //nolint:forbidigo with both"
        - pattern: '^context\.TODO$'
          msg: "a fresh root context needs a stated reason and a named owner — carry the caller's ctx, or //nolint:forbidigo with both"
        - pattern: '^time\.Tick$'
          msg: "time.Tick's ticker can never be stopped — use time.NewTicker with a deferred Stop"
        - pattern: '^time\.After$'
          msg: "time.After's timer can never be stopped — use time.NewTimer with a deferred Stop"
    gocritic:
      enabled-checks:
        - deferInLoop      # a defer inside a loop never runs until the function returns
    govet:
      enable:
        - nilness          # provable nil dereference or impossible nil comparison
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments

  exclusions:
    rules:
      # Test files may hard-code fixtures and skip a few production-only rules.
      - path: _test\.go
        linters:
          - goconst
          - gosec
          - unparam
          - forbidigo
      # main packages are outside forbidigo's fresh-root-context/unstoppable-timer
      # reach; every other gate this task adds still binds main packages.
      - path: ^cmd/
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/maratik123/lab-game
