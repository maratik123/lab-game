name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      harness: ${{ steps.filter.outputs.harness }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Any future Go or harness artefact must be added here in the same PR
          # that introduces it, or its gate silently stops running.
          filters: |
            go:
              - '**/*.go'
              - '**/*.sql'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'Makefile'
              - '.github/workflows/**'
              - 'config/**'
              - '.env.example'
            harness:
              - '.claude/**'
              - 'ai-docs/**'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              # The gate-log-path suite asserts about .gitignore's content — a
              # root *.gate.log must NOT be ignored, tmp/*.gate.log must be.
              # Without this line a .gitignore-only commit matches no filter,
              # every job's `if:` is false, and the assertion that would catch
              # a re-added rule never runs. "A job that did not run is not a
              # passing job" (AGENTS.md § Build & Test).
              - '.gitignore'
            workflows:
              - '.github/workflows/**'

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          install-only: true
      - run: make fmt-check

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - run: make vet
      - run: make tidy-check

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - run: make test-race
      # The ratchet is the LAST gate, not the only one: the pre-commit hook is
      # where a drop is meant to be caught. This step catches a commit made on
      # a machine whose core.hooksPath is unset, and it re-rolls the suite's
      # timing-dependent statements on a runner rather than on the author's
      # machine — see the drift measurement in .githooks/coverage-ratchet.sh.
      - run: make cover-ratchet

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          install-only: true
      - run: make lint
      - run: make file-limits

  harness:
    name: Harness guards
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    # The citation guard resolves `#N` against this repository's pull requests,
    # so it needs more than the workflow-level `contents: read`. Without it the
    # GraphQL call is refused, the high-water mark comes back empty, and every
    # `#N` reads as unresolvable — a red job that says nothing about citations.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Check out the BRANCH, not the detached merge commit: the task-run writer
      # records `git branch --show-current`, and on a detached HEAD it correctly
      # degrades to `incomplete: true` — which its own suite asserts against.
      # The guards must run in the environment the scripts really run in.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: shellcheck every harness script
        run: |
          set -euo pipefail
          find .claude -name '*.sh' -print0 | xargs -0 -r shellcheck -s bash
      - name: shellcheck every hook body in settings.json
        run: |
          set -euo pipefail
          jq -r '.hooks[][].hooks[].command' .claude/settings.json > /tmp/bodies.txt
          fail=0
          while IFS= read -r body; do
            printf '%s\n' "$body" | shellcheck -s bash - || fail=1
          done < /tmp/bodies.txt
          exit "$fail"
      - name: citation namespaces resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .claude/skills/ai-audit/scripts/check-citations.sh
      - name: context-status PR locators are filled
        run: |
          set -euo pipefail
          test -f ai-docs/context-status.md
          if grep -n 'TBD-at-Step-12' ai-docs/context-status.md; then
            echo "::error file=ai-docs/context-status.md::an entry heading still carries the #TBD-at-Step-12 placeholder; /task Step 12 sub-step 10a fills it after gh pr create"
            exit 1
          fi
      - name: guard regression suites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .claude/skills/ai-audit/scripts/test-check-citations.sh
          bash .claude/skills/task/scripts/test-append-task-run.sh
          bash .claude/skills/ai-audit/scripts/test-piped-gate-guard.sh
          bash .claude/skills/ai-audit/scripts/test-spawn-contract-guard.sh
          bash .claude/skills/task/scripts/test-stop-gate.sh
          bash .claude/skills/ai-audit/scripts/test-gate-log-path-guard.sh
          bash .claude/skills/ai-audit/scripts/test-no-verify-guard.sh
          bash .claude/skills/ai-audit/scripts/test-ac-shape.sh
          bash .claude/skills/ai-audit/scripts/test-review-register.sh
          bash .claude/skills/task/scripts/test-precommit-dispatch.sh
      - name: acceptance criteria state conditions, not tests
        run: bash .claude/skills/ai-audit/scripts/check-ac-shape.sh
      - name: relative markdown links resolve
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for f in (p for p in pathlib.Path(".").rglob("*.md") if ".git/" not in str(p)):
              for m in re.finditer(r'\[[^\]]*\]\(([^)#\s]+)(#[^)]*)?\)', f.read_text()):
                  t = m.group(1)
                  if t.startswith(("http://", "https://", "mailto:")) or "<" in t or t == "file.md":
                      continue
                  if not (f.parent / t).resolve().exists():
                      bad.append(f"{f} -> {t}")
          for b in bad:
              print(f"::error::broken relative link {b}")
          sys.exit(1 if bad else 0)
          PY

  actionlint:
    name: Actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error
