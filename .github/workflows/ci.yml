name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      harness: ${{ steps.filter.outputs.harness }}
      workflows: ${{ steps.filter.outputs.workflows }}
      commentrefs: ${{ steps.filter.outputs.commentrefs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Any future Go or harness artefact must be added here in the same PR
          # that introduces it, or its gate silently stops running.
          filters: |
            go:
              - '**/*.go'
              - '**/*.sql'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'Makefile'
              - '.github/workflows/**'
              - 'config/**'
              - '.env.example'
            harness:
              - '.claude/**'
              - 'ai-docs/**'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              # The gate-log-path suite asserts about the content of the
              # entry below: a root gate log must NOT be ignored, one under
              # the scratch directory must be. Without the entry here, a
              # commit touching only that file does not reach this job, and
              # the assertion that would catch a re-added rule never runs. A
              # job that did not run is not a passing job.
              - '.gitignore'
              # A commit touching only the pre-commit dispatcher or the
              # coverage-ratchet script must still reach the shellcheck gate,
              # which this job is the only one to run; the target that sweep
              # runs from is named here too, for the same reason.
              - '.githooks/**'
              - 'Makefile'
            workflows:
              - '.github/workflows/**'
            # Every path class the comment-reference gate reaches — kept as
            # its own key because neither `go` nor `harness` names the whole
            # gated set: the first omits the shell class, the second omits
            # the Go class.
            commentrefs:
              - '**/*.go'
              - '**/*.sh'
              - '**/*.sql'
              - '**/*.yml'
              - '**/*.yaml'
              - '.gitignore'
              - '.env.example'
              - 'Makefile'
              - '.githooks/**'

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          install-only: true
      - run: make fmt-check

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - run: make vet
      - run: make tidy-check
      - run: make import-guard

  # The Test job is split into four sibling jobs below — test, test-race,
  # cover-ratchet, test-fallback — each gated exactly as the job it replaces:
  # same needs, same if, one make target apiece. Four jobs rather than four
  # steps of one because siblings run at the same time: a run costs the
  # slowest of them instead of their sum, and a gate that goes red no longer
  # stops the other three from reporting — which is the point, since a step
  # that never executed tells you nothing. Sequencing any of them after
  # another, however reasonable it looks for one pair, gives both of those
  # back: none of the four may acquire a needs: on another.
  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

  test-race:
    name: Race
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-race

  cover-ratchet:
    name: Coverage ratchet
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # This job is not the only gate: the pre-commit hook is where a drop is
      # meant to be caught. This job catches a commit made on a machine whose
      # core.hooksPath is unset, and it re-rolls the suite's timing-dependent
      # statements on a runner rather than on the author's machine.
      - run: make cover-ratchet

  test-fallback:
    name: Test fallback
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # No sibling job still reaches the per-binary container path: test,
      # test-race and cover-ratchet all provision or reuse one shared
      # server. Without this job that path would be true only on the day
      # it was checked, and unchecked forever after.
      - run: make test-fallback

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          install-only: true
      - run: make lint
      - run: make file-limits

  harness:
    name: Harness guards
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    # The citation guard resolves `#N` against this repository's pull requests
    # and issues -- they share one number sequence, and the ceiling is the newer
    # of the two -- so it needs more than the workflow-level `contents: read`.
    # Without either grant that read is refused and the guard stops as an
    # instrument error, a red job that says nothing about citations.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      # Check out the BRANCH, not the detached merge commit: the task-run writer
      # records `git branch --show-current`, and on a detached HEAD it correctly
      # degrades to `incomplete: true` — which its own suite asserts against.
      # The guards must run in the environment the scripts really run in.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: shellcheck every tracked script
        run: make shellcheck
      - name: shellcheck every hook body in settings.json
        run: |
          set -euo pipefail
          jq -r '.hooks[][].hooks[].command' .claude/settings.json > /tmp/bodies.txt
          fail=0
          while IFS= read -r body; do
            printf '%s\n' "$body" | shellcheck -s bash - || fail=1
          done < /tmp/bodies.txt
          exit "$fail"
      - name: citation namespaces resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .claude/skills/ai-audit/scripts/check-citations.sh
      - name: context-status PR locators are filled
        run: |
          set -euo pipefail
          test -f ai-docs/context-status.md
          if grep -n 'TBD-at-Step-12' ai-docs/context-status.md; then
            echo "::error file=ai-docs/context-status.md::an entry heading still carries the #TBD-at-Step-12 placeholder; /task Step 12 sub-step 10a fills it after gh pr create"
            exit 1
          fi
      - name: guard regression suites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .claude/skills/ai-audit/scripts/test-check-citations.sh
          bash .claude/skills/task/scripts/test-append-task-run.sh
          bash ai-docs/scripts/test-piped-gate-guard.sh
          bash ai-docs/scripts/test-spawn-contract-guard.sh
          bash ai-docs/scripts/test-stop-gate.sh
          bash ai-docs/scripts/test-gate-log-path-guard.sh
          bash ai-docs/scripts/test-no-verify-guard.sh
          bash ai-docs/scripts/test-ac-shape.sh
          bash ai-docs/scripts/test-review-register.sh
          bash ai-docs/scripts/test-precommit-dispatch.sh
          bash ai-docs/scripts/test-instruction-edit-guard.sh
          bash ai-docs/scripts/test-doc-edit-guard.sh
          bash ai-docs/scripts/test-spec-shape.sh
          bash ai-docs/scripts/test-spec-anchors.sh
          bash ai-docs/scripts/test-script-shape.sh
          bash ai-docs/scripts/test-harness-gaps-forge.sh
      - name: acceptance criteria state conditions, not tests
        run: bash ai-docs/scripts/check-ac-shape.sh
      - name: specs locate by commit or symbol and store no tally
        run: bash ai-docs/scripts/check-spec-shape.sh
      - name: every spec row names its source in the owner's words
        run: bash ai-docs/scripts/check-spec-anchors.sh
      - name: every script's --help dispatch shape; shebang-extension pairing
        run: bash ai-docs/scripts/check-script-shape.sh
      - name: harness-gaps closing fields are written by a forge branch only
        run: bash ai-docs/scripts/check-harness-gaps-forge.sh
      - name: relative markdown links resolve
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for f in (p for p in pathlib.Path(".").rglob("*.md") if ".git/" not in str(p)):
              for m in re.finditer(r'\[[^\]]*\]\(([^)#\s]+)(#[^)]*)?\)', f.read_text()):
                  t = m.group(1)
                  if t.startswith(("http://", "https://", "mailto:")) or "<" in t or t == "file.md":
                      continue
                  if not (f.parent / t).resolve().exists():
                      bad.append(f"{f} -> {t}")
          for b in bad:
              print(f"::error::broken relative link {b}")
          sys.exit(1 if bad else 0)
          PY

  actionlint:
    name: Actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

  comment-refs:
    name: Comment references
    needs: changes
    if: needs.changes.outputs.commentrefs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make comment-refs
